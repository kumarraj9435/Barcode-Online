<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Label Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0ede8;
    --card: #ffffff;
    --ink: #1a1814;
    --ink2: #6b6760;
    --accent: #d94f3d;
    --accent2: #e8b84b;
    --border: #ddd9d3;
    --radius: 12px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(217,79,61,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(232,184,75,0.08) 0%, transparent 50%);
  }

  .wrapper {
    width: 100%;
    max-width: 520px;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .header p {
    font-size: 13px;
    color: var(--ink2);
    margin-top: 6px;
    font-family: 'DM Mono', monospace;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 24px rgba(26,24,20,0.06), 0 1px 4px rgba(26,24,20,0.04);
  }

  .field { margin-bottom: 20px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
    font-family: 'DM Mono', monospace;
  }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #faf9f7;
    position: relative;
  }

  .upload-zone:hover { border-color: var(--accent); background: #fff5f4; }
  .upload-zone.has-file { border-style: solid; border-color: #c8e6c9; background: #f1f8f1; }

  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .upload-icon {
    font-size: 28px;
    margin-bottom: 6px;
    display: block;
  }

  .upload-text { font-size: 13px; color: var(--ink2); }
  .upload-text strong { color: var(--ink); }

  .preview-box {
    margin-top: 14px;
    background: #faf9f7;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    display: none;
  }

  .preview-box img {
    max-height: 80px;
    max-width: 100%;
    object-fit: contain;
  }

  input[type=text], input[type=number], select {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: #faf9f7;
    outline: none;
    transition: border-color 0.2s;
    appearance: none;
  }

  input[type=text]:focus,
  input[type=number]:focus,
  select:focus { border-color: var(--accent); background: #fff; }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink2);
    pointer-events: none;
    font-size: 12px;
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    letter-spacing: 0.2px;
  }

  .btn:hover { background: #c43e2d; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(217,79,61,0.3); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

  .toast {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    display: none;
    font-weight: 500;
    text-align: center;
  }
  .toast.ok  { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
  .toast.err { background: #fdecea; color: #b71c1c; border: 1px solid #f5c0bb; display: block; }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  .size-hint {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--ink2);
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <h1>Barcode Label Generator</h1>
    <p>Upload · Name · Download PDF</p>
  </div>

  <div class="card">

    <!-- Upload -->
    <div class="field">
      <label>Barcode Image</label>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="barcodeFile" accept="image/*">
        <span class="upload-icon">📷</span>
        <div class="upload-text"><strong>Click to upload</strong> or drag & drop</div>
        <div class="upload-text" style="font-size:11px;margin-top:2px">PNG, JPG, BMP supported</div>
      </div>
      <div class="preview-box" id="previewBox">
        <img id="previewImg" src="" alt="Barcode preview">
      </div>
    </div>

    <!-- Name -->
    <div class="field">
      <label>Product Name (appears under barcode)</label>
      <input type="text" id="labelName" placeholder="e.g. MAGTEC 500" value="">
    </div>

    <div class="divider"></div>

    <!-- Layout -->
    <div class="row">
      <div class="field">
        <label>Labels per page</label>
        <div class="select-wrap">
          <select id="labelsPerPage">
            <option value="2x5" selected>10 (2 columns x 5 rows)</option>
            <option value="3x4">12 (3 columns x 4 rows)</option>
            <option value="3x5">15 (3 columns x 5 rows)</option>
            <option value="4x5">20 (4 columns x 5 rows)</option>
            <option value="4x6">24 (4 columns x 6 rows)</option>
            <option value="5x6">30 (5 columns x 6 rows)</option>
            <option value="6x9">54 (6 columns x 9 rows)</option>
          </select>
        </div>
        <div class="size-hint" id="sizeHint">Each label: ~95mm × 54mm</div>
      </div>

      <div class="field">
        <label>Number of pages</label>
        <input type="number" id="numPages" value="1" min="1" max="50">
      </div>
    </div>

    <button class="btn" id="generateBtn" onclick="generatePDF()">⬇ Save as PDF</button>
    <div class="toast" id="toast"></div>

  </div>
</div>

<script>
  var imgDataUrl = null;

  // File input
  document.getElementById('barcodeFile').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      imgDataUrl = ev.target.result;
      document.getElementById('previewImg').src = imgDataUrl;
      document.getElementById('previewBox').style.display = 'block';
      document.getElementById('uploadZone').classList.add('has-file');
      document.getElementById('uploadZone').querySelector('.upload-text').innerHTML =
        '<strong>' + file.name + '</strong>';
    };
    reader.readAsDataURL(file);
  });

  // Drag & drop
  var zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.style.borderColor = '#d94f3d'; });
  zone.addEventListener('dragleave', function() { zone.style.borderColor = ''; });
  zone.addEventListener('drop', function(e) {
    e.preventDefault();
    zone.style.borderColor = '';
    var file = e.dataTransfer.files[0];
    if (file) {
      document.getElementById('barcodeFile').files; // can't set, use FileReader directly
      var reader = new FileReader();
      reader.onload = function(ev) {
        imgDataUrl = ev.target.result;
        document.getElementById('previewImg').src = imgDataUrl;
        document.getElementById('previewBox').style.display = 'block';
        zone.classList.add('has-file');
        zone.querySelector('.upload-text').innerHTML = '<strong>' + file.name + '</strong>';
      };
      reader.readAsDataURL(file);
    }
  });

  // Size hints
  var hints = {
    '2x5': 'Each label: ~95mm × 54mm',
    '3x4': 'Each label: ~63mm × 67mm',
    '3x5': 'Each label: ~63mm × 54mm',
    '4x5': 'Each label: ~47mm × 54mm',
    '4x6': 'Each label: ~47mm × 45mm',
    '5x6': 'Each label: ~37mm × 45mm',
    '6x9': 'Each label: ~31mm × 30mm',
  };
  document.getElementById('labelsPerPage').addEventListener('change', function() {
    document.getElementById('sizeHint').textContent = hints[this.value] || '';
  });

  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
  }

  function generatePDF() {
    if (!imgDataUrl) { showToast('Pehle barcode image upload karo.', 'err'); return; }

    var name        = document.getElementById('labelName').value.trim();
    var layout      = document.getElementById('labelsPerPage').value;
    var numPages    = parseInt(document.getElementById('numPages').value) || 1;
    var btn         = document.getElementById('generateBtn');
    btn.disabled    = true;
    btn.textContent = 'Generating...';

    var parts = layout.split('x');
    var cols  = parseInt(parts[0]);
    var rows  = parseInt(parts[1]);

    try {
      var { jsPDF } = window.jspdf;
      var doc = new jsPDF({ unit: 'mm', format: 'a4' });

      // A4: 210 x 297 mm
      var pageW     = 210;
      var pageH     = 297;
      var marginX   = 8;
      var marginY   = 10;
      var gapX      = 4;
      var gapY      = 4;

      var cellW = (pageW - 2 * marginX - (cols - 1) * gapX) / cols;
      var cellH = (pageH - 2 * marginY - (rows - 1) * gapY) / rows;

      var padX    = 3;
      var padY    = 3;
      var nameH   = name ? 6 : 0;
      var imgH    = cellH - 2 * padY - nameH;
      var imgW    = cellW - 2 * padX;

      for (var p = 0; p < numPages; p++) {
        if (p > 0) doc.addPage();

        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            var x = marginX + c * (cellW + gapX);
            var y = marginY + r * (cellH + gapY);

            // Label border
            doc.setDrawColor(200, 200, 200);
            doc.setLineWidth(0.3);
            doc.roundedRect(x, y, cellW, cellH, 2, 2, 'S');

            // Barcode image
            doc.addImage(imgDataUrl, 'PNG', x + padX, y + padY, imgW, imgH, '', 'FAST');

            // Name text
            if (name) {
              doc.setFontSize(7);
              doc.setFont('helvetica', 'bold');
              doc.setTextColor(30, 30, 30);
              doc.text(name, x + cellW / 2, y + padY + imgH + nameH - 1, { align: 'center' });
            }
          }
        }
      }

      doc.save('barcode-labels.pdf');
      showToast('✓ PDF saved! Check your downloads folder.', 'ok');

    } catch(e) {
      showToast('Error: ' + e.message, 'err');
    }

    btn.disabled    = false;
    btn.textContent = '⬇ Save as PDF';
  }
</script>
</body>
</html>
